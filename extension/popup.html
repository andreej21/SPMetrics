<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body { width: 340px; margin: 0; font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
    header { padding: 12px 14px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 8px; }
    header b { font-size: 14px; }
    .status { padding: 12px 14px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
    .ok { background: #dcfce7; color: #166534; }
    .no { background: #f3f4f6; color: #6b7280; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.ok { background: #16a34a; } .dot.no { background: #9ca3af; }
    dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
    dt { color: #6b7280; } dd { margin: 0; word-break: break-all; font-family: ui-monospace, monospace; font-size: 12px; }
    h3 { margin: 14px 14px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; }
    ul { list-style: none; margin: 0; padding: 0 14px 14px; max-height: 180px; overflow: auto; }
    li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #f1f5f9; }
    .type { font-family: ui-monospace, monospace; }
    .badge { font-size: 11px; color: #2563eb; }
    .empty { padding: 0 14px 14px; color: #9ca3af; }
    @media (prefers-color-scheme: dark) {
      header { border-color: #333; } li { border-color: #222; }
      .ok { background: #14532d; color: #bbf7d0; } .no { background: #262626; color: #9ca3af; }
    }
  </style>
</head>
<body>
  <header><b>SPMetrics</b> <span style="color:#9ca3af">Pixel Helper</span></header>
  <div class="status" id="status">Checking…</div>
  <h3>Events fired this page</h3>
  <ul id="events"></ul>
  <div class="empty" id="empty" hidden>No events captured yet — interact with the page.</div>
  <script src="popup.js"></script>
</body>
</html>
